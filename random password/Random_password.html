<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card">
    <h2>Password Generator</h2>

    <div class="output-container">
      <input type="text" id="passwordOutput" readonly placeholder="Click Generate" />
      <button class="copy-btn" id="copyBtn">Copy</button>
    </div>

    <div class="control">
      <label for="length">Password Length</label>
      <input type="number" id="length" value="10" min="4" max="32" />
    </div>

    <div class="control">
      <label for="uppercase">Include Uppercase (A-Z)</label>
      <input type="checkbox" id="uppercase" checked />
    </div>

    <div class="control">
      <label for="lowercase">Include Lowercase (a-z)</label>
      <input type="checkbox" id="lowercase" checked />
    </div>

    <div class="control">
      <label for="numbers">Include Numbers (0-9)</label>
      <input type="checkbox" id="numbers" checked />
    </div>

    <div class="control">
      <label for="symbols">Include Symbols (!@#$)</label>
      <input type="checkbox" id="symbols" checked />
    </div>

    <button class="generate-btn" id="generateBtn">Generate Password</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
